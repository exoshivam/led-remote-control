<!DOCTYPE html>
<html>
<head>
  <title>RGB LED Controller</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 2em; }
    input[type=range] { width: 80%; }
  </style>
</head>
<body>
  <h2>Control RGB LED</h2>

  <div>
    <label>Red: <span id="rval">0</span></label><br>
    <input type="range" id="r" min="0" max="255">
  </div>
  <div>
    <label>Green: <span id="gval">0</span></label><br>
    <input type="range" id="g" min="0" max="255">
  </div>
  <div>
    <label>Blue: <span id="bval">0</span></label><br>
    <input type="range" id="b" min="0" max="255">
  </div>

  <script>
    const r = document.getElementById("r");
    const g = document.getElementById("g");
    const b = document.getElementById("b");
    const rVal = document.getElementById("rval");
    const gVal = document.getElementById("gval");
    const bVal = document.getElementById("bval");

    const socket = new WebSocket("wss://" + location.host);

    function sendColor() {
      const data = {
        type: "color",
        data: {
          r: parseInt(r.value),
          g: parseInt(g.value),
          b: parseInt(b.value)
        }
      };
      socket.send(JSON.stringify(data));
    }

    [r, g, b].forEach((slider) => {
      slider.addEventListener("input", () => {
        rVal.textContent = r.value;
        gVal.textContent = g.value;
        bVal.textContent = b.value;
        sendColor();
      });
    });
  </script>
</body>
</html>
